<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>three questions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 900px; height: 460px; overflow: hidden; }
  body {
    background-color: #0F1A2E;
    background-image: radial-gradient(circle, #1E293B 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 12px 12px;
    font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #F8FAFC;
    padding: 28px 60px;
  }
  .title { font-size: 18px; color: #67E8F9; letter-spacing: 1px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #94A3B8; margin-bottom: 24px; }
  .questions { display: flex; flex-direction: column; gap: 14px; }
  .q { display: flex; gap: 16px; align-items: stretch; background: #0B1220; border-left: 3px solid #67E8F9; padding: 14px 18px; border-radius: 4px; }
  .q-num { font-size: 28px; font-weight: 700; color: #67E8F9; min-width: 56px; line-height: 1; align-self: center; }
  .q-content { flex: 1; }
  .q-text { font-size: 14px; color: #F8FAFC; font-weight: 600; margin-bottom: 4px; letter-spacing: 0.3px; }
  .q-explain { font-size: 11px; color: #94A3B8; line-height: 1.5; }
  .q-yes { color: #67E8F9; font-weight: 700; min-width: 60px; text-align: center; align-self: center; }
  .footer { margin-top: 22px; padding: 12px 18px; background: rgba(251,191,36,0.08); border-left: 3px solid #FBBF24; font-size: 13px; color: #FBBF24; font-weight: 600; letter-spacing: 0.4px; }
</style></head><body>
  <div class="title">装一个新 SKILL 之前，问自己这三个问题</div>
  <div class="subtitle">三个全过了再装；任何一个不过，就别装</div>
  <div class="questions">
    <div class="q">
      <div class="q-num">01</div>
      <div class="q-content">
        <div class="q-text">它能解决一个具体的、重复出现的痛点吗</div>
        <div class="q-explain">每周 / 每两周 / 每月用得到，才算高频。每个月用不到一次的，不装。</div>
      </div>
      <div class="q-yes">是 ✓</div>
    </div>
    <div class="q">
      <div class="q-num">02</div>
      <div class="q-content">
        <div class="q-text">它跟我已装的 skill 有没有功能重叠</div>
        <div class="q-explain">触发词不同但能力相同的 skill，挤占预算却没新价值。挑一个留下，删另一个。</div>
      </div>
      <div class="q-yes">否 ✓</div>
    </div>
    <div class="q">
      <div class="q-num">03</div>
      <div class="q-content">
        <div class="q-text">它的维护状态可靠吗</div>
        <div class="q-explain">最近 commit 在 3 个月内 / issue 区有人活动 / README 写得清楚。这三个看完，能淘汰 80%。</div>
      </div>
      <div class="q-yes">是 ✓</div>
    </div>
  </div>
  <div class="footer">三个问题全过了，再装。否则，不装。</div>
</body></html>
