<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>img-14</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:540px;overflow:hidden}
  body{background:#F8F4ED;background-image:radial-gradient(circle at 8% 14%,rgba(244,196,48,.06) 0,transparent 18%),radial-gradient(circle at 92% 86%,rgba(31,31,31,.04) 0,transparent 22%);font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#1F1F1F;padding:24px 50px;position:relative}
  body::before{content:'';position:absolute;top:14px;right:30px;width:78px;height:52px;background:#F4C430;opacity:.85;border:2.5px solid #1F1F1F;border-radius:4px 32px 4px 4px;transform:rotate(8deg)}
  body::after{content:'';position:absolute;bottom:14px;left:22px;width:56px;height:14px;background:#1F1F1F;border-radius:50%;transform:rotate(-15deg);opacity:.85}
  .title{font-size:46px;font-weight:900;letter-spacing:1px;margin-bottom:4px;line-height:1.1}
  .title .hl{background:linear-gradient(transparent 58%,#F4C430 58%,#F4C430 94%,transparent 94%);padding:0 6px}
  .subtitle{font-size:18px;color:#444;margin-bottom:24px;font-weight:500}
  .qs{display:flex;flex-direction:column;gap:14px}
  .q{display:flex;align-items:stretch;background:#FFFCF6;border:3px solid #1F1F1F;border-left:10px solid #1F1F1F;border-radius:6px;padding:0;box-shadow:5px 5px 0 #1F1F1F;overflow:hidden}
  .q:nth-child(2){background:#FCE99A}
  .q-num{background:#F4C430;color:#1F1F1F;font-size:38px;font-weight:900;padding:14px 20px;display:flex;align-items:center;border-right:3px solid #1F1F1F;min-width:80px;justify-content:center}
  .q-body{flex:1;padding:14px 20px}
  .q-text{font-size:22px;font-weight:900;letter-spacing:0.5px;margin-bottom:4px;line-height:1.2}
  .q-explain{font-size:14px;color:#1F1F1F;line-height:1.45;font-weight:500}
  .q-yes{padding:14px 22px;display:flex;align-items:center;font-size:24px;font-weight:900;color:#0a8a3a;border-left:3px solid #1F1F1F;background:rgba(244,196,48,.5)}
  .stamp{position:absolute;left:50px;bottom:30px;background:#F4C430;color:#1F1F1F;padding:8px 16px;border:3px solid #1F1F1F;border-radius:6px;font-size:15px;font-weight:800;transform:rotate(-3deg);box-shadow:4px 4px 0 #1F1F1F;line-height:1.35}
  .footer{position:absolute;bottom:18px;right:50px;font-size:14px;color:#444;background:#FFFCF6;border-left:4px solid #F4C430;padding:3px 12px;transform:rotate(-1deg);font-weight:600}
</style></head><body>
  <div class="title">装新 Skill 之前，<span class="hl">问自己三个问题</span></div>
  <div class="subtitle">三个全过了再装，任何一个不过，就别装</div>
  <div class="qs">
    <div class="q">
      <div class="q-num">01</div>
      <div class="q-body">
        <div class="q-text">能解决一个具体的、重复出现的痛点吗</div>
        <div class="q-explain">每周 / 每两周 / 每月用得到，才算高频。每个月用不到一次的，不装。</div>
      </div>
      <div class="q-yes">是 ✓</div>
    </div>
    <div class="q">
      <div class="q-num">02</div>
      <div class="q-body">
        <div class="q-text">跟我已装的 skill 有功能重叠吗</div>
        <div class="q-explain">触发词不同但能力相同的 skill，挤占预算却没新价值。挑一个留下，删另一个。</div>
      </div>
      <div class="q-yes">否 ✓</div>
    </div>
    <div class="q">
      <div class="q-num">03</div>
      <div class="q-body">
        <div class="q-text">维护状态可靠吗</div>
        <div class="q-explain">最近 commit 在 3 个月内 / issue 区有人活动 / README 写得清楚。这三个看完，能淘汰 80%。</div>
      </div>
      <div class="q-yes">是 ✓</div>
    </div>
  </div>
  <div class="stamp">三个全过 → 装上 ✓</div>
  <div class="footer">研究生必装的 11 个 Skill</div>
</body></html>
