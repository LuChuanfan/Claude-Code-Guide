<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>img-2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:540px;overflow:hidden}
  body{background:#F8F4ED;background-image:radial-gradient(circle at 8% 14%,rgba(244,196,48,.06) 0,transparent 18%),radial-gradient(circle at 92% 86%,rgba(31,31,31,.04) 0,transparent 22%);font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#1F1F1F;padding:26px 50px 24px;position:relative}
  body::before{content:'';position:absolute;top:14px;right:30px;width:78px;height:52px;background:#F4C430;opacity:.85;border:2.5px solid #1F1F1F;border-radius:4px 32px 4px 4px;transform:rotate(8deg)}
  body::after{content:'';position:absolute;bottom:18px;left:22px;width:56px;height:14px;background:#1F1F1F;border-radius:50%;transform:rotate(-15deg) skewX(-6deg);opacity:.85}
  .title{font-size:50px;font-weight:900;letter-spacing:1px;margin-bottom:6px;line-height:1.1}
  .title .hl{background:linear-gradient(transparent 58%,#F4C430 58%,#F4C430 94%,transparent 94%);padding:0 6px}
  .subtitle{font-size:19px;color:#444;margin-bottom:22px;font-weight:500}
  .pyramid{position:relative;width:980px;height:350px;margin:0 auto}
  .layer{position:absolute;left:50%;transform:translateX(-50%);background:#FFFCF6;border:3px solid #1F1F1F;border-radius:8px;padding:14px 28px;text-align:center;box-shadow:5px 5px 0 #1F1F1F}
  .layer.l1{width:360px;top:0;background:#F4C430}
  .layer.l2{width:540px;top:116px;background:#FCE99A}
  .layer.l3{width:720px;top:232px;background:#FFFCF6}
  .layer-tag{display:inline-block;background:#1F1F1F;color:#FFFCF6;font-size:14px;padding:3px 12px;border-radius:99px;margin-bottom:6px;font-weight:700}
  .layer-name{font-size:30px;font-weight:900;letter-spacing:1px;line-height:1.1}
  .layer-name .small{font-size:16px;font-weight:500;color:#333;display:block;margin-top:4px}
  .note{position:absolute;font-size:17px;color:#1F1F1F;line-height:1.35;background:#FFFCF6;border:2px solid #1F1F1F;padding:6px 14px;border-radius:4px;font-weight:600}
  .note.n1{top:14px;right:-14px;transform:rotate(3deg)}
  .note.n2{top:132px;right:-14px;transform:rotate(-2deg)}
  .note.n3{top:250px;right:-14px;transform:rotate(2deg)}
  .arrow{position:absolute;border-top:2px dashed #1F1F1F;width:60px;height:0}
  .arrow.a1{top:36px;right:110px}
  .arrow.a2{top:156px;right:110px}
  .arrow.a3{top:274px;right:110px}
  .arrow::after{content:'▶';position:absolute;right:-2px;top:-11px;font-size:16px}
  .stamp{position:absolute;left:50px;bottom:40px;background:#F4C430;color:#1F1F1F;padding:10px 20px;border:3px solid #1F1F1F;border-radius:6px;font-size:18px;font-weight:800;transform:rotate(-4deg);box-shadow:4px 4px 0 #1F1F1F}
  .footer{position:absolute;bottom:24px;right:50px;font-size:15px;color:#444;background:#FFFCF6;border-left:4px solid #F4C430;padding:4px 14px;transform:rotate(-1deg);font-weight:600}
</style></head><body>
  <div class="title">下载 Skill 优先级，<span class="hl">从顶往下找</span></div>
  <div class="subtitle">先翻第一档，没有再下沉到第二档，最后才考虑第三档</div>
  <div class="pyramid">
    <div class="layer l1"><span class="layer-tag">第一档</span><div class="layer-name">Anthropic 官方<span class="small">github.com/anthropics/skills</span></div></div>
    <div class="layer l2"><span class="layer-tag">第二档</span><div class="layer-name">圈内大 V<span class="small">卡兹克 / 一泽 Eze / gstack 等</span></div></div>
    <div class="layer l3"><span class="layer-tag">第三档</span><div class="layer-name">个人项目<span class="small">看 commit 频率与 issue 维护</span></div></div>
    <div class="note n1">流程稳健<br>跨平台 / 长期维护</div>
    <div class="note n2">作者天天用<br>问题修得快</div>
    <div class="note n3">有惊喜<br>也有坑</div>
    <div class="arrow a1"></div><div class="arrow a2"></div><div class="arrow a3"></div>
  </div>
  <div class="stamp">先在第一档找 ✓</div>
  <div class="footer">研究生必装的 11 个 Skill</div>
</body></html>
