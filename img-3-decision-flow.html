<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>img-3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:620px;overflow:hidden}
  body{background:#F8F4ED;background-image:radial-gradient(circle at 8% 14%,rgba(244,196,48,.06) 0,transparent 18%),radial-gradient(circle at 92% 86%,rgba(31,31,31,.04) 0,transparent 22%);font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#1F1F1F;padding:24px 50px;position:relative}
  body::before{content:'';position:absolute;top:14px;right:30px;width:78px;height:52px;background:#F4C430;opacity:.85;border:2.5px solid #1F1F1F;border-radius:4px 32px 4px 4px;transform:rotate(8deg)}
  body::after{content:'';position:absolute;bottom:14px;left:22px;width:56px;height:14px;background:#1F1F1F;border-radius:50%;transform:rotate(-15deg);opacity:.85}
  .title{font-size:46px;font-weight:900;letter-spacing:1px;margin-bottom:4px;line-height:1.1}
  .title .hl{background:linear-gradient(transparent 58%,#F4C430 58%,#F4C430 94%,transparent 94%);padding:0 6px}
  .subtitle{font-size:18px;color:#444;margin-bottom:24px;font-weight:500}
  .flow{position:relative;width:980px;height:430px;margin:0 auto}
  .node{position:absolute;background:#FFFCF6;border:3px solid #1F1F1F;border-radius:8px;padding:12px 22px;text-align:center;box-shadow:5px 5px 0 #1F1F1F;font-weight:800}
  .node.start{left:50%;top:0;transform:translateX(-50%);width:260px;background:#F4C430;font-size:22px}
  .node.q1{left:50%;top:90px;transform:translateX(-50%);width:380px;font-size:20px}
  .node.q2{left:50%;top:200px;transform:translateX(-50%);width:380px;font-size:20px}
  .node.q3{left:50%;top:310px;transform:translateX(-50%);width:380px;font-size:20px}
  .node.end-good{left:50%;top:402px;transform:translateX(-50%);background:#F4C430;width:200px;font-size:24px;color:#1F1F1F}
  .node.end-bad{position:absolute;background:#FFFCF6;border:3px solid #C0392B;color:#C0392B;font-weight:800;font-size:20px;padding:10px 18px;border-radius:8px;box-shadow:5px 5px 0 #C0392B}
  .end-bad.b1{top:90px;right:0;width:180px;text-align:center}
  .end-bad.b2{top:200px;left:0;width:180px;text-align:center}
  .end-bad.b3{top:310px;right:0;width:180px;text-align:center}
  .arrow-v{position:absolute;left:50%;width:0;height:30px;border-left:3px dashed #1F1F1F;transform:translateX(-50%)}
  .arrow-v::after{content:'▼';position:absolute;left:-9px;bottom:-10px;font-size:18px;color:#1F1F1F}
  .arrow-v.av1{top:60px}.arrow-v.av2{top:170px}.arrow-v.av3{top:280px}.arrow-v.av4{top:380px;height:20px}
  .arrow-h{position:absolute;height:0;border-top:3px dashed #1F1F1F}
  .arrow-h.h1{top:115px;right:200px;width:90px}.arrow-h.h1::after{content:'▶';position:absolute;right:-2px;top:-12px;font-size:18px}
  .arrow-h.h2{top:225px;left:200px;width:90px}.arrow-h.h2::before{content:'◀';position:absolute;left:-2px;top:-12px;font-size:18px}
  .arrow-h.h3{top:335px;right:200px;width:90px}.arrow-h.h3::after{content:'▶';position:absolute;right:-2px;top:-12px;font-size:18px}
  .label-yes{position:absolute;left:50%;font-size:14px;color:#1F1F1F;font-weight:700;background:#FCE99A;padding:1px 6px;transform:translateX(-50%)}
  .label-no{position:absolute;font-size:14px;color:#C0392B;font-weight:700;background:#FFFCF6;padding:1px 6px;border:1px solid #C0392B}
  .ly1{top:70px}.ly2{top:180px}.ly3{top:290px}
  .ln1{top:108px;right:295px}.ln2{top:218px;left:295px}.ln3{top:328px;right:295px}
  .footer{position:absolute;bottom:18px;right:50px;font-size:14px;color:#444;background:#FFFCF6;border-left:4px solid #F4C430;padding:3px 12px;transform:rotate(-1deg);font-weight:600}
</style></head><body>
  <div class="title">想装新 Skill，<span class="hl">先跑这条流程</span></div>
  <div class="subtitle">三个判断节点，任何一个不过就别装</div>
  <div class="flow">
    <div class="node start">想装新 skill</div>
    <div class="arrow-v av1"></div>
    <div class="node q1">官方 / 圈内大 V 维护？</div>
    <div class="arrow-v av2"></div><span class="label-yes ly1">是</span>
    <div class="node q2">跟现有 skill 没冲突？</div>
    <div class="arrow-v av3"></div><span class="label-yes ly2">是</span>
    <div class="node q3">每月用得到一次以上？</div>
    <div class="arrow-v av4"></div><span class="label-yes ly3">是</span>
    <div class="node end-good">装上 ✓</div>
    <div class="arrow-h h1"></div><span class="label-no ln1">否</span>
    <div class="node end-bad b1">先看维护状态</div>
    <div class="arrow-h h2"></div><span class="label-no ln2">是，重叠</span>
    <div class="node end-bad b2">二选一</div>
    <div class="arrow-h h3"></div><span class="label-no ln3">否</span>
    <div class="node end-bad b3">不装</div>
  </div>
  <div class="footer">研究生必装的 11 个 Skill</div>
</body></html>
