<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Skill Count vs Recall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 900px; height: 500px; overflow: hidden; }
  body {
    background-color: #0F1A2E;
    background-image: radial-gradient(circle, #1E293B 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 12px 12px;
    font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #F8FAFC;
    padding: 32px 60px;
  }
  .title { font-size: 18px; color: #67E8F9; letter-spacing: 1px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #94A3B8; margin-bottom: 18px; }
  svg { display: block; }
  .axis-label { font-size: 13px; fill: #CBD5E1; font-family: inherit; }
  .grid line { stroke: #1E293B; stroke-width: 1; }
  .axis line { stroke: #475569; stroke-width: 1.5; }
  .curve { fill: none; stroke: #67E8F9; stroke-width: 3; }
  .danger-curve { fill: none; stroke: #F87171; stroke-width: 2; stroke-dasharray: 4,4; }
  .healthy-band { fill: #FBBF24; fill-opacity: 0.12; }
  .healthy-label { font-size: 13px; fill: #FBBF24; font-weight: 600; }
  .annotation { font-size: 12px; fill: #94A3B8; }
  .peak-dot { fill: #67E8F9; }
  .legend-text { font-size: 12px; fill: #CBD5E1; }
</style></head><body>
  <div class="title">SKILL 装机量 vs Claude 召回准确率</div>
  <div class="subtitle">装得越多不一定越聪明，12-15 个是健康水位</div>
  <svg width="780" height="380" viewBox="0 0 780 380">
    <g class="grid">
      <line x1="60" y1="50" x2="760" y2="50"/>
      <line x1="60" y1="120" x2="760" y2="120"/>
      <line x1="60" y1="190" x2="760" y2="190"/>
      <line x1="60" y1="260" x2="760" y2="260"/>
    </g>
    <rect class="healthy-band" x="200" y="40" width="80" height="290"/>
    <text class="healthy-label" x="240" y="30" text-anchor="middle">健康水位 12-15</text>
    <g class="axis">
      <line x1="60" y1="330" x2="760" y2="330"/>
      <line x1="60" y1="40" x2="60" y2="330"/>
    </g>
    <text class="axis-label" x="410" y="365" text-anchor="middle">已安装 skill 数量（个）</text>
    <text class="axis-label" x="20" y="190" text-anchor="middle" transform="rotate(-90 20 190)">召回准确率</text>
    <text class="axis-label" x="60" y="350" text-anchor="middle">0</text>
    <text class="axis-label" x="200" y="350" text-anchor="middle">10</text>
    <text class="axis-label" x="280" y="350" text-anchor="middle">15</text>
    <text class="axis-label" x="410" y="350" text-anchor="middle">25</text>
    <text class="axis-label" x="550" y="350" text-anchor="middle">35</text>
    <text class="axis-label" x="690" y="350" text-anchor="middle">45</text>
    <text class="axis-label" x="50" y="55" text-anchor="end">100%</text>
    <text class="axis-label" x="50" y="195" text-anchor="end">50%</text>
    <text class="axis-label" x="50" y="335" text-anchor="end">0%</text>
    <path class="curve" d="M 60 290 Q 130 80 240 60 Q 350 100 470 200 Q 580 270 690 305 L 760 315"/>
    <circle class="peak-dot" cx="240" cy="60" r="6"/>
    <text class="annotation" x="240" y="50" text-anchor="middle" fill="#67E8F9">峰值 ~94%</text>
    <text class="annotation" x="690" y="295" text-anchor="middle">装到 45 个，召回掉到 ~30%</text>
    <line x1="630" y1="280" x2="690" y2="295" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="2,2"/>
    <g transform="translate(530,75)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#67E8F9" stroke-width="3"/>
      <text class="legend-text" x="28" y="4">召回准确率</text>
    </g>
  </svg>
</body></html>
