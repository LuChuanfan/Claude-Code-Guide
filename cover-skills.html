<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skills Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 900px;
    height: 383px;
    overflow: hidden;
  }

  body {
    background-color: #0F1A2E;
    background-image: radial-gradient(circle, #1E293B 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 12px 12px;
    font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    position: relative;
    margin: 0;
    padding: 0;
  }

  .prompt {
    position: absolute;
    top: 60px;
    left: 60px;
    font-size: 14px;
    color: #67E8F9;
    letter-spacing: 0.5px;
    font-weight: 500;
  }

  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .title {
    font-size: 96px;
    font-weight: 700;
    color: #F8FAFC;
    letter-spacing: 6px;
    line-height: 1;
  }

  .underline {
    width: 380px;
    height: 1px;
    background: #67E8F9;
    opacity: 0.85;
    margin: 22px auto 0;
  }

  .subtitle {
    margin-top: 18px;
    font-size: 16px;
    color: #CBD5E1;
    letter-spacing: 4px;
    font-weight: 400;
  }

  .cursor {
    position: absolute;
    top: 267px;
    right: 180px;
    font-size: 16px;
    color: #67E8F9;
    line-height: 1;
  }

  .footer {
    position: absolute;
    top: 342px;
    left: 60px;
    font-size: 13px;
    color: #94A3B8;
    letter-spacing: 0.4px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="prompt">$ claude --skills</div>

  <div class="center">
    <div class="title">SKILLS</div>
    <div class="underline"></div>
    <div class="subtitle">研究生必装合集</div>
  </div>

  <div class="cursor">█</div>

  <div class="footer">github.com/LuChuanfan/Claude-Code-Guide</div>
</body>
</html>
